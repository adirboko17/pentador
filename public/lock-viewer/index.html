<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>מנעול Pentador בתלת־ממד</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: pan-y !important; }
    canvas:active { cursor: grabbing; }
    #poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="מנעול Pentador בתלת־ממד, ניתן לסיבוב בגרירה"></canvas>
  <img id="poster" src="/assets/lock-hero.png" alt="שני צדי מנעול Pentador">

  <script src="three-r147/build/three.min.js"></script>
  <script src="three-r147/examples/js/loaders/DRACOLoader.js"></script>
  <script src="three-r147/examples/js/loaders/GLTFLoader.js"></script>
  <script src="three-r147/examples/js/controls/OrbitControls.js"></script>
  <script src="three-r147/examples/js/environments/RoomEnvironment.js"></script>
  <script>
    async function showLock() {
      const canvas = document.getElementById('stage');
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setClearColor(0x000000, 0);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.physicallyCorrectLights = true;

      const scene = new THREE.Scene();
      const environment = new THREE.PMREMGenerator(renderer);
      const studio = new THREE.RoomEnvironment();
      scene.environment = environment.fromScene(studio, 0.03).texture;
      studio.dispose();
      environment.dispose();

      const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 200);
      camera.position.set(-3.2, 0.9, 11);
      camera.zoom = 1.04;
      const controls = new THREE.OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.07;
      controls.enableZoom = false;
      controls.enablePan = false;
      controls.maxPolarAngle = Math.PI * 0.62;
      controls.autoRotate = !matchMedia('(prefers-reduced-motion: reduce)').matches;
      controls.autoRotateSpeed = 2;

      function addLight(color, intensity, x, y, z) {
        const light = new THREE.DirectionalLight(color, intensity);
        light.position.set(x, y, z);
        scene.add(light);
      }
      addLight(0xffffff, 2.6, 3, 10, 6);
      addLight(0xbfd6ff, 1.8, -7, 3, -6);
      addLight(0xffe3cc, 0.5, -6, -2, 8);
      addLight(0xffffff, 0.8, 0, 10, -2);

      const decoder = new THREE.DRACOLoader();
      decoder.setDecoderPath('three-r147/examples/js/libs/draco/gltf/');
      try {
        const loader = new THREE.GLTFLoader().setDRACOLoader(decoder);
        const model = await loader.loadAsync('pentador.glb');
        const root = model.scene.getObjectByName('PENTADOR_Smart_Lock');
        root.scale.setScalar(0.01);
        const outside = root.getObjectByName('Outside_Panel');
        const inside = root.getObjectByName('Inside_Panel');
        // Centre the back plates (18 mm and 20 mm deep) on a shared mounting plane.
        outside.position.set(0, 0, 9);
        inside.rotation.y = Math.PI;
        inside.position.set(0, 0, -10);
        root.traverse(node => {
          if (node.isMesh) node.material.envMapIntensity = 0.75;
        });
        scene.add(root);
      } finally {
        decoder.dispose();
      }

      function resize() {
        const { clientWidth: width, clientHeight: height } = canvas;
        renderer.setSize(width, height, false);
        camera.aspect = width / Math.max(1, height);
        camera.updateProjectionMatrix();
      }
      resize();
      window.addEventListener('resize', resize);
      let visible = true;
      new IntersectionObserver(([entry]) => { visible = entry.isIntersecting; }).observe(canvas);
      const poster = document.getElementById('poster');
      renderer.setAnimationLoop(() => {
        if (!visible || document.hidden) return;
        controls.update();
        renderer.render(scene, camera);
        if (!poster.hidden) poster.hidden = true;
      });
    }

    showLock().catch(error => console.error('Unable to display the Pentador model', error));
  </script>
</body>
</html>
